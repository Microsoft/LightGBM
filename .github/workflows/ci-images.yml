name: ci-images

on:
  workflow_dispatch:
    inputs:
      tag-suffix:
        type: string
        default: ""
        required: false
        description: |
          Suffix for image tags, including a leading "-" if desired.
          Set to the empty string to overwrite the main images used by LightGBM's CI.

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: none

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/lightgbm-ci

jobs:
  build-and-push-images:
    name: build-ci-images (${{ matrix.image-tag }})
    runs-on: ${{ matrix.os }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-ppc64le
            dockerfile: .ci/ci-images/ppc64le-manylinux/Dockerfile
            image-tag: ppc64le-manylinux-2_28${{ inputs.tag-suffix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # explicitly setting 'context' avoids 'docker/build-push-action' doing a second git clone
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ matrix.image-tag }}
          # enable zstd compression (for faster pulls)
          outputs: type=registry,compression=zstd,force-compression=true,oci-mediatypes=true,compression-level=15
      # create an attestation to prove that this image came from a workflow in this repository
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
