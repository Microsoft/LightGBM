name: pr

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: none

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
  static-analysis:
    uses: ./.github/workflows/static_analysis.yml
    permissions:
      contents: read
  swig:
    uses: ./.github/workflows/swig.yml
    permissions:
      contents: write
      id-token: write
  test-cpp:
    uses: ./.github/workflows/cpp.yml
    permissions:
      contents: write
  test-python:
    uses: ./.github/workflows/python_package.yml
    permissions:
      contents: read
      id-token: write
  test-r:
    uses: ./.github/workflows/r_package.yml
    permissions:
      contents: write
  all-required-pr-jobs:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build
      - static-analysis
      - swig
      - test-cpp
      - test-python
      - test-r
    permissions:
      statuses: read
    steps:
      - name: Note that all tests succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
