version: 2
build:
  os: "ubuntu-24.04"
  tools:
    python: "miniforge3-latest"
  jobs:
    post_checkout:
      - cp CONTRIBUTING.md docs/CONTRIBUTING.md

conda:
  environment: docs/env.yml
formats:
  - pdf
sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
submodules:
  include: all
  recursive: true
